<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Entrar · Oficina IA</title>
<link rel="icon" href="/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="/estilos.css">
<script type="module" src="/login.js"></script>
</head>
<body class="pagina-login">
<main class="login">
  <div class="marca"><span class="logo" aria-hidden="true"></span><h1>Oficina IA</h1></div>
  <p class="tenue">Desde aquí se pueden dar órdenes a tus agentes. Introduce la contraseña de la oficina.</p>
  <form id="f-login">
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button class="btn" type="submit" id="entrar">Entrar</button>
    <p id="error" class="error" role="alert"></p>
  </form>
</main>
</body>
</html>
