# Oficina IA: ve tus sesiones de Claude Code en una oficina 3D y dales órdenes.
#
#   mkdir -p ~/.claude/ai-office ~/.claude/projects   # antes del primer arranque (ver README)
#   docker compose up -d --build          # levanta la oficina
#   docker compose run --rm instalar      # instala los hooks en ~/.claude/settings.json (una vez)
#   AI_OFFICE_DEMO=1 docker compose up    # prueba sin Claude Code, con agentes simulados
#
# Local (por defecto): enlace de un solo uso en el log: docker compose logs oficina | grep entrar
# VPS: en .env pon PUBLICAR_IP=0.0.0.0 y OFICINA_PASSWORD; se abre en https://IP_DEL_VPS:7777.
# Ver .env.example.

x-endurecido: &endurecido
  read_only: true
  tmpfs:
    - /tmp:size=16m
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  user: "${UID_GID:-1000:1000}"

services:
  oficina:
    <<: *endurecido
    build: ./oficina
    image: ai-office-3d/oficina:local
    container_name: ai-office
    restart: unless-stopped
    ports:
      # Panel: 127.0.0.1 por defecto; PUBLICAR_IP=0.0.0.0 (o la IP pública) para verlo desde fuera.
      - "${PUBLICAR_IP:-127.0.0.1}:${PUERTO:-7777}:7777"
      # Hooks de Claude Code: siempre solo en el propio equipo.
      - "127.0.0.1:${PUERTO_HOOKS:-7778}:7778"
    environment:
      PUBLICAR_IP: "${PUBLICAR_IP:-127.0.0.1}"
      # 1 = exige contraseña aunque PUBLICAR_IP sea local (detrás de un proxy inverso).
      ACCESO_REMOTO: "${ACCESO_REMOTO:-0}"
      OFICINA_PASSWORD: "${OFICINA_PASSWORD:-}"
      # Ruta DENTRO del contenedor; el archivo se monta aparte (ver README). Evita que la contraseña salga en docker inspect.
      OFICINA_PASSWORD_FILE: "${OFICINA_PASSWORD_FILE:-}"
      # Usuario del servidor que trabaja con Claude Code: sale en el comando de «Conectar».
      OFICINA_USUARIO: "${OFICINA_USUARIO:-}"
      TLS: "${TLS:-}"
      TLS_HOSTS: "${TLS_HOSTS:-}"
      TLS_CERT: "${TLS_CERT:-}"
      TLS_KEY: "${TLS_KEY:-}"
      CONFIAR_PROXY: "${CONFIAR_PROXY:-0}"
      GUARDIA_MAX_MIN: "${GUARDIA_MAX_MIN:-14}"
      AI_OFFICE_DEMO: "${AI_OFFICE_DEMO:-0}"
      # Puerto del enlace de un solo uso que sale en el log.
      PUERTO_PUBLICO: "${PUERTO:-7777}"
    volumes:
      # Solo lectura y solo lo necesario: transcripts (tokens y sesiones recientes) y el token de los hooks.
      # El resto de ~/.claude (credenciales de Claude, settings.json) no entra en este contenedor.
      # Crea estas carpetas antes de levantarlo: si no existen, Docker las crea como root.
      - "${CLAUDE_DIR:-${HOME}/.claude}/projects:/claude/projects:ro"
      - "${CLAUDE_DIR:-${HOME}/.claude}/ai-office:/claude/ai-office:ro"
      # Certificado autofirmado (se reutiliza entre reinicios).
      - oficina-datos:/datos
    mem_limit: 256m
    pids_limit: 100

  instalar:
    <<: *endurecido
    profiles: ["instalar"]
    build: ./oficina
    image: ai-office-3d/oficina:local
    network_mode: none
    entrypoint: ["node", "scripts/instalar-hooks.mjs"]
    environment:
      CLAUDE_DIR: /claude
      PUERTO_HOOKS: "${PUERTO_HOOKS:-7778}"
      GUARDIA_MAX_MIN: "${GUARDIA_MAX_MIN:-14}"
    volumes:
      # Lectura y escritura solo para este paso: añade los hooks a settings.json.
      - "${CLAUDE_DIR:-${HOME}/.claude}:/claude"

volumes:
  oficina-datos:
